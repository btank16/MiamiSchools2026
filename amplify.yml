version: 1
applications:
  - appRoot: backend
    backend:
      phases:
        preBuild:
          commands:
            # Match the Lambda runtime and keep CI npm in step with the npm that
            # wrote package-lock.json, so lockfile validation behaves the same
            # locally and in the build.
            - nvm use 22
        build:
          commands:
            # `npm install` (not `npm ci`): @aws-amplify/data-construct and
            # graphql-api-construct ship bundled @opentelemetry packages whose
            # internal versions disagree. `npm ci` validates those bundled edges
            # and fails with "Missing: @opentelemetry/core@2.0.0 from lock file";
            # `npm install` trusts the bundle and still installs the locked versions.
            - npm install --no-audit --no-fund --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    # Phases run from appRoot (backend/), so the Vite app is built in ../frontend
    # and its output copied back under appRoot for Amplify Hosting to serve.
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            # The frontend imports ../amplify_outputs.json; regenerate it for this
            # branch's backend so each branch's site calls its own API.
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID --out-dir ..
            - (cd ../frontend && npm ci --no-audit --no-fund)
        build:
          commands:
            - (cd ../frontend && npm run build)
            - rm -rf dist && cp -r ../frontend/dist dist
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths: []
