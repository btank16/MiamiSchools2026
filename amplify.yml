version: 1
applications:
  - appRoot: backend
    backend:
      phases:
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            - echo "Building backend"
      artifacts:
        baseDirectory: .
        files:
          - '**/*'
      cache:
        paths: []
